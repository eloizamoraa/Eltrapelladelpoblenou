[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trapella-facturas"
version = "0.1.0"
description = "Procesado automático de las facturas que llegan a facturas@eltrapelladelpoblenou.com"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "mcp>=2.0",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trapella-facturas = "trapella_facturas.cli:main"
trapella-facturas-mcp = "trapella_facturas.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
